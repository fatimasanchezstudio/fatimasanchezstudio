    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"

    />
    <link rel="stylesheet" href="/src/styles.css" />

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Fátima Sánchez Studio">

        <nav class="nav" data-nav aria-label="Principal">
          <a class="is-active" href="/">Inicio</a>

        <button

          type="button"

          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" aria-label="Retrato de la artista">

          <img
            src="/images/hero-home.png"
            alt="Fátima Sánchez pintando en el estudio"
            width="1584"

          />

          <div class="footer-col footer-contact">
            <h2 class="footer-heading">Contacto</h2>
            <div class="footer-list">
              <a class="footer-link" href="mailto:info.fatima.studio@gmail.com">
                <svg class="footer-link-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5.5" width="18" height="13" rx="1.5" />

              <a

                href="https://www.instagram.com/fatimasanchezstudio/"

                  <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" />
